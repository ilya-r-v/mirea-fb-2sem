global
    log         127.0.0.1 local2
    maxconn     4000
    daemon


defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option                  http-server-close
    option                  forwardfor except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance     roundrobin

    # Проверка доступности: GET /health каждые 2 секунды
    option      httpchk GET /health
    http-check  expect status 200

    # Основные серверы
    server server1 127.0.0.1:3000 check inter 2s rise 2 fall 3
    server server2 127.0.0.1:3001 check inter 2s rise 2 fall 3

    # Резервный сервер (backup) — используется при недоступности основных
    server server3 127.0.0.1:3002 check inter 2s rise 2 fall 3 backup

frontend stats
    bind *:8080
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin
    stats refresh 10s
    stats show-node