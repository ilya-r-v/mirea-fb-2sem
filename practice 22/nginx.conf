events {
    worker_connections 1024;
}

http {
    # ── Группа backend-серверов (Round Robin по умолчанию) ───────────────────
    upstream backend {
        # Основные серверы с настройками отказоустойчивости:
        #   max_fails=2     — пометить сервер недоступным после 2 неудачных попыток
        #   fail_timeout=30s — не направлять запросы на него в течение 30 секунд
        server 127.0.0.1:3000 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:3001 max_fails=2 fail_timeout=30s;

        # Резервный сервер — используется только когда оба основных недоступны
        server 127.0.0.1:3002 backup;
    }

    # ── Альтернативная группа: Least Connections ─────────────────────────────
    # upstream backend_lc {
    #     least_conn;
    #     server 127.0.0.1:3000 max_fails=2 fail_timeout=30s;
    #     server 127.0.0.1:3001 max_fails=2 fail_timeout=30s;
    # }

    # ── Альтернативная группа: IP Hash ────────────────────────────────────────
    # upstream backend_iphash {
    #     ip_hash;
    #     server 127.0.0.1:3000;
    #     server 127.0.0.1:3001;
    # }

    server {
        listen 80;
        server_name localhost;

        # Логи
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;

        # ── Проксирование всех запросов на группу backend ───────────────────
        location / {
            proxy_pass         http://backend;

            # Передаём реальный IP клиента на backend
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # Повторная попытка при ошибках и таймаутах
            proxy_next_upstream error timeout http_500 http_502 http_503;
        }

        # ── Страница статуса Nginx (только локально) ─────────────────────────
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny  all;
        }
    }
}